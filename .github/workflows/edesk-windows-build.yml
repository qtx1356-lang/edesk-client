name: eDesk Windows x64 build and release
run-name: eDesk Windows build

on:
  # Automatically build and publish a signed update after changes to the app.
  push:
    branches:
      - edesk-work
  workflow_dispatch:

concurrency:
  group: edesk-windows-build
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

env:
  RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml
    with:
      windows_x64_only: true

  build-topmost-window:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10

  build-windows-x64:
    name: Build Windows x64 baseline
    runs-on: windows-2022
    needs: [generate-bridge, build-topmost-window]
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Assign a unique eDesk update version
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $manifest = Get-Content .\Cargo.toml -Raw
          if ($manifest -notmatch '(?m)^version\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"') {
            throw "Could not read the base eDesk version from Cargo.toml."
          }
          $highestVersion = [version]$Matches[1]
          # Use gh release list's JSON projection to reliably read every published tag.
          # The raw paginated API output can be parsed inconsistently by Windows PowerShell.
          $releaseTags = @(gh release list --limit 100 --json tagName --jq '.[].tagName')
          if ($LASTEXITCODE -ne 0) { throw "Could not retrieve the eDesk release list." }
          foreach ($latestTag in $releaseTags) {
            if ([string]$latestTag -match '^edesk-v([0-9]+\.[0-9]+\.[0-9]+)$') {
              $latestVersion = [version]$Matches[1]
              if ($latestVersion -gt $highestVersion) { $highestVersion = $latestVersion }
            }
          }
          if ($releaseTags.Count -eq 0) {
            Write-Host "No previous stable release found; using the source version."
          }
          $nextPatch = $highestVersion.Build + 1
          if ($nextPatch -gt 65535) { throw "eDesk patch version exceeded the supported range." }
          $version = "$($highestVersion.Major).$($highestVersion.Minor).$nextPatch"
          $manifest = [regex]::Replace($manifest, '(?m)^(version\s*=\s*")[0-9]+\.[0-9]+\.[0-9]+(")', ('${1}' + $version + '${2}'), 1)
          Set-Content -Path .\Cargo.toml -Value $manifest -NoNewline
          $lock = Get-Content .\Cargo.lock -Raw
          $lockPattern = '(?ms)(\[\[package\]\]\r?\nname = "rustdesk"\r?\nversion = ")[^"]+(")'
          $lockUpdated = [regex]::Replace($lock, $lockPattern, ('${1}' + $version + '${2}'), 1)
          if ($lockUpdated -eq $lock) { throw "Could not update the rustdesk root package version in Cargo.lock." }
          Set-Content -Path .\Cargo.lock -Value $lockUpdated -NoNewline
          Add-Content -Path $env:GITHUB_ENV -Value "VERSION=$version"
          Write-Host "Building and publishing eDesk $version"
      - name: Restore Flutter Rust bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Install RustDesk custom Flutter engine
        shell: powershell
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          $engine = (Get-Command flutter).Source
          $flutterRoot = Split-Path (Split-Path $engine)
          Copy-Item -Path windows-x64-release/* -Destination "$flutterRoot\bin\cache\artifacts\engine\windows-x64-release\" -Recurse -Force

      - name: Patch Flutter 3.24 dropdown menu
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff "$(dirname "$(dirname "$(which flutter)")")"
          cd "$(dirname "$(dirname "$(which flutter)")")"
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: windows-2022

      - name: Setup vcpkg with GitHub Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          if ! "$VCPKG_ROOT/vcpkg" install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"; then
            find "$VCPKG_ROOT/" -name "*.log" | while read -r file; do
              echo "$file:"
              cat "$file"
            done
            exit 1
          fi
          head -n 100 "$VCPKG_ROOT/buildtrees/ffmpeg/build-x64-windows-static-rel-out.log" || true

      - name: Build Windows Flutter application
        shell: powershell
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack
          Move-Item ./flutter/build/windows/x64/runner/Release ./edesk-baseline

      - name: Add RustDesk temporary topmost window helper
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: topmostwindow-artifacts-x64
          path: ./edesk-baseline

      - name: Remove non-runtime build files
        shell: powershell
        run: |
          $extensions = @(".pdb", ".ilk", ".exp", ".lib", ".map")
          Get-ChildItem .\\edesk-baseline -Recurse -File |
            Where-Object { $extensions -contains $_.Extension.ToLowerInvariant() } |
            Remove-Item -Force


      # Optional production Authenticode signing. Enable only after SSL.com eSigner
      # is enrolled and the three ESIGNER_* repository secrets are configured.
      - name: Initialize SSL.com eSigner and sign eDesk application
        if: ${{ vars.EDESK_CODE_SIGNING_ENABLED == 'true' }}
        shell: powershell
        env:
          ESIGNER_USERNAME: ${{ secrets.ESIGNER_USERNAME }}
          ESIGNER_PASSWORD: ${{ secrets.ESIGNER_PASSWORD }}
          ESIGNER_TOTP_SECRET: ${{ secrets.ESIGNER_TOTP_SECRET }}
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($name in @("ESIGNER_USERNAME", "ESIGNER_PASSWORD", "ESIGNER_TOTP_SECRET")) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing GitHub Actions secret: $name"
            }
          }
          $work = Join-Path $env:RUNNER_TEMP "edesk-esigner"
          $installDir = Join-Path $work "CKA"
          New-Item -ItemType Directory -Force -Path $work, $installDir | Out-Null
          $archive = Join-Path $work "esigner-cka.zip"
          Invoke-WebRequest -Uri "https://github.com/SSLcom/eSignerCKA/releases/download/v1.0.6/SSL.COM-eSigner-CKA_1.0.6.zip" -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $work -Force
          $setup = Get-ChildItem $work -Filter "*.exe" -Recurse |
            Where-Object { $_.Name -match "Installer|Setup" } |
            Select-Object -First 1
          if (-not $setup) { throw "SSL.com eSigner CKA installer was not found in the downloaded archive." }
          & $setup.FullName /CURRENTUSER /VERYSILENT /SUPPRESSMSGBOXES "/DIR=$installDir"
          if ($LASTEXITCODE -ne 0) { throw "SSL.com eSigner CKA installation failed: $LASTEXITCODE" }
          $cka = Join-Path $installDir "eSignerCKATool.exe"
          if (-not (Test-Path $cka)) {
            $cka = (Get-ChildItem $installDir -Filter "eSignerCKATool.exe" -Recurse | Select-Object -First 1).FullName
          }
          if (-not $cka -or -not (Test-Path $cka)) { throw "eSignerCKATool.exe was not installed." }
          $masterKey = Join-Path $work "master.key"
          & $cka config -mode "product" -user $env:ESIGNER_USERNAME -pass $env:ESIGNER_PASSWORD -totp $env:ESIGNER_TOTP_SECRET -key $masterKey -r
          if ($LASTEXITCODE -ne 0) { throw "eSigner CKA account configuration failed." }
          & $cka unload
          if ($LASTEXITCODE -ne 0) { throw "eSigner CKA certificate unload step failed." }
          & $cka load
          if ($LASTEXITCODE -ne 0) { throw "eSigner CKA certificate load step failed." }
          $certs = @(Get-ChildItem Cert:\CurrentUser\My -CodeSigningCert)
          if ($certs.Count -ne 1) {
            throw "Expected exactly one eSigner code-signing certificate in the runner user store; found $($certs.Count). Configure a dedicated eSigner account with one code-signing certificate."
          }
          $thumbprint = $certs[0].Thumbprint
          Add-Content -Path $env:GITHUB_ENV -Value "EDESK_SIGNING_THUMBPRINT=$thumbprint"
          $sdkRoot = Join-Path $env:ProgramFiles "(x86)\Windows Kits\10\bin"
          $signtool = Get-ChildItem $sdkRoot -Filter "signtool.exe" -Recurse |
            Where-Object { $_.FullName -match "\\x64\\signtool.exe$" } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "Windows SDK x64 signtool.exe was not found." }
          & $signtool.FullName sign /fd SHA256 /tr http://ts.ssl.com /td SHA256 /sha1 $thumbprint /v ".\edesk-baseline\edesk.exe"
          if ($LASTEXITCODE -ne 0) { throw "Signing edesk.exe failed." }
          & $signtool.FullName verify /pa /all /v ".\edesk-baseline\edesk.exe"
          if ($LASTEXITCODE -ne 0) { throw "Authenticode verification of edesk.exe failed." }

      - name: Build complete eDesk self-update package
        shell: powershell
        run: |
          python3 -m pip install --disable-pip-version-check -r .\libs\portable\requirements.txt
          python3 .\libs\portable\generate.py -f .\edesk-baseline -o .\libs\portable -e .\edesk-baseline\edesk.exe
          if ($LASTEXITCODE -ne 0) { throw "eDesk portable update package build failed." }
          Copy-Item .\target\release\rustdesk-portable-packer.exe ".\edesk-$env:VERSION-install.exe" -Force
          if (-not (Test-Path ".\edesk-$env:VERSION-install.exe")) {
            throw "eDesk self-update package was not created."
          }

      - name: Report package size
        shell: powershell
        run: |
          $files = Get-ChildItem .\edesk-baseline -Recurse -File
          $total = ($files | Measure-Object -Property Length -Sum).Sum
          Write-Host ("Unpacked application size: {0:N2} MB" -f ($total / 1MB))
          $files | Sort-Object Length -Descending | Select-Object -First 15 FullName, Length | Format-Table -AutoSize

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup --no-progress --yes
          $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if (-not $iscc) {
            $candidates = @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
            )
            $isccPath = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          } else {
            $isccPath = $iscc.Source
          }
          if (-not $isccPath) { throw "Inno Setup compiler (ISCC.exe) was not found." }
          New-Item -ItemType Directory -Force -Path .\dist | Out-Null
          & $isccPath "/DMyAppVersion=$env:VERSION" .\packaging\windows\eDesk.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed with exit code $LASTEXITCODE." }
          if (-not (Test-Path .\dist\eDesk-Setup.exe)) { throw "eDesk-Setup.exe was not created." }


      - name: Sign eDesk installer and self-update executable
        if: ${{ vars.EDESK_CODE_SIGNING_ENABLED == 'true' }}
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:EDESK_SIGNING_THUMBPRINT)) {
            throw "The eSigner certificate thumbprint from the initialization step is missing."
          }
          $sdkRoot = Join-Path $env:ProgramFiles "(x86)\Windows Kits\10\bin"
          $signtool = Get-ChildItem $sdkRoot -Filter "signtool.exe" -Recurse |
            Where-Object { $_.FullName -match "\\x64\\signtool.exe$" } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "Windows SDK x64 signtool.exe was not found." }
          $files = @(".\dist\eDesk-Setup.exe", ".\edesk-$env:VERSION-install.exe")
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "Signing input not found: $file" }
            & $signtool.FullName sign /fd SHA256 /tr http://ts.ssl.com /td SHA256 /sha1 $env:EDESK_SIGNING_THUMBPRINT /v $file
            if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed for $file" }
            & $signtool.FullName verify /pa /all /v $file
            if ($LASTEXITCODE -ne 0) { throw "Authenticode verification failed for $file" }
          }

      - name: Upload eDesk Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: edesk-windows-installer-x64
          path: .\dist\eDesk-Setup.exe
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

      - name: Upload eDesk self-update package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: edesk-update-package-x64
          path: .\edesk-*-install.exe
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

      - name: Generate signed eDesk update metadata
        shell: powershell
        env:
          EDESK_UPDATE_SIGNING_KEY: ${{ secrets.EDESK_UPDATE_SIGNING_KEY }}
        run: |
          if (-not $env:EDESK_UPDATE_SIGNING_KEY) {
            throw "Add the EDESK_UPDATE_SIGNING_KEY repository secret before publishing automatic eDesk updates."
          }
          python3 -m pip install --disable-pip-version-check cryptography
          python3 .\scripts\create_edesk_update_metadata.py --version $env:VERSION --tag "edesk-v$env:VERSION" --package ".\edesk-$env:VERSION-install.exe" --output-dir .\dist
          if ($LASTEXITCODE -ne 0) { throw "eDesk update metadata signing failed." }

      - name: Upload signed eDesk update metadata
        if: ${{ hashFiles('dist/edesk-update.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: edesk-signed-update-metadata-x64
          path: |
            .\dist\edesk-update.json
            .\dist\edesk-update.json.sig
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

      - name: Publish signed eDesk stable release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (-not (Test-Path ".\dist\edesk-update.json") -or -not (Test-Path ".\dist\edesk-update.json.sig")) {
            throw "Signed eDesk update metadata is missing."
          }
          $tag = "edesk-v$env:VERSION"
          gh release create $tag ".\dist\eDesk-Setup.exe" ".\edesk-$env:VERSION-install.exe" ".\dist\edesk-update.json" ".\dist\edesk-update.json.sig" --target $env:GITHUB_SHA --title "eDesk $env:VERSION" --notes "Automatically published signed eDesk update."
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish signed eDesk release $tag." }
      - name: Upload unsigned eDesk baseline
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: edesk-baseline-windows-x64
          path: ./edesk-baseline
          if-no-files-found: error
          retention-days: 7
          compression-level: 9